<link
  id="palette"
  rel="stylesheet"

  fetchpriority="high"
/>

<script>
  const STATIC_FILE_MAP = {
    active: "/static/dist/esbuild/active.NEAHVJIY.css",
    "anodized.palette": "/static/dist/esbuild/anodized.palette.J6S3CQLN.css",
    awesome: "/static/dist/esbuild/awesome.AAIUI5BK.css",
    "base.palette": "/static/dist/esbuild/base.palette.DKTTKNN3.css",
    "bright.palette": "/static/dist/esbuild/bright.palette.SRDNSU53.css",
    brutalist: "/static/dist/esbuild/brutalist.PTPPU2SS.css",
    "elegant.palette": "/static/dist/esbuild/elegant.palette.ISE233FZ.css",
    glossy: "/static/dist/esbuild/glossy.4XLGFSE3.css",
    matter: "/static/dist/esbuild/matter.3HKLNWSY.css",
    mellow: "/static/dist/esbuild/mellow.LKCURJQL.css",
    "mild.palette": "/static/dist/esbuild/mild.palette.TZ7BYNMX.css",
    "natural.palette": "/static/dist/esbuild/natural.palette.A7KL64SQ.css",
    "nb-category": "/static/dist/esbuild/nb-category.YWP2QGT5.css",
    playful: "/static/dist/esbuild/playful.EMMGR62Q.css",
    premium: "/static/dist/esbuild/premium.VQ777S5V.css",
    "rudimentary.palette": "/static/dist/esbuild/rudimentary.palette.5RMLLFZP.css",
    shoelace: "/static/dist/esbuild/shoelace.Y5I6725N.css",
    "shoelace.palette": "/static/dist/esbuild/shoelace.palette.R7QSLK2U.css",
    tailspin: "/static/dist/esbuild/tailspin.TMGTIW2E.css",
    "vogue.palette": "/static/dist/esbuild/vogue.palette.3K4PPLCW.css",
  };

  const myTheme = "{{ user_settings.settings.theme }}";
  if (myTheme.length) {
    let themeLink = document.getElementById("theme");
    themeLink.href = STATIC_FILE_MAP[myTheme] ?? "";
  }

  const myPalette = "{{ user_settings.settings.color_palette }}";
  if (myPalette.length) {
    let paletteLink = document.getElementById("palette");
    paletteLink.href = STATIC_FILE_MAP[myPalette + ".palette"] ?? "";
  }
</script>
