services:
  caddy:
    image: ghcr.io/niklasbaumgardner/budgets-caddy:latest
    container_name: caddy
    build:
      context: .
      dockerfile: caddy/Dockerfile
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    ports:
      - "9443:443"
    depends_on:
      - web
    networks:
      - budget-network
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  web:
    image: ghcr.io/niklasbaumgardner/budgets:latest
    container_name: web
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 9090
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_USER: ${EMAIL_USER}
      SECRET_KEY: ${SECRET_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      SCOUT_KEY: ${SCOUT_KEY}
      SIMPLEFIN_KEY: ${SIMPLEFIN_KEY}
      FERNET_KEY: ${FERNET_KEY}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      REMEMBER_COOKIE_NAME: ${REMEMBER_COOKIE_NAME}
      SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRESQL_USERNAME}:${POSTGRESQL_PASSWORD}@pgbouncer:7432/${PGBOUNCER_DATABASE}
      COOKIE_DOMAIN: .niklasb.com
      REMEMBER_COOKIE_DOMAIN: .niklasb.com
    depends_on:
      - pgbouncer
    networks:
      - budget-network
    restart: unless-stopped

  pgbouncer:
    image: railwayapp/pgbouncer
    container_name: pgbouncer
    ports:
      - "7432:6432"
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE}
      PGBOUNCER_POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      PGBOUNCER_MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-5}
      PGBOUNCER_DATABASE: ${PGBOUNCER_DATABASE}
      PGBOUNCER_LISTEN_ADDRESS: 0.0.0.0
    depends_on:
      - postgres
    networks:
      - budget-network
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: 5432
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - budget-network
    restart: unless-stopped

networks:
  budget-network:
    driver: bridge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
